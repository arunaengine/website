<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" width="760" height="330" aria-label="An upload goes through a storage backend to a copy, a placement policy allows or refuses that copy, and a bucket sync writes a second bucket on another node">
  <title>How an upload becomes copies</title>
  <defs>
    <marker id="wdl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#335DC6" />
    </marker>
    <marker id="wdl-arrow-aqua" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#24A9E6" />
    </marker>
  </defs>
  <rect width="760" height="330" rx="12" fill="#ffffff" />
  <g font-family="Inter, system-ui, sans-serif" fill="#08216C">
    <text x="32" y="34" font-size="15" font-weight="600">One node: an upload becomes a copy</text>

    <rect x="32" y="58" width="150" height="58" rx="10" fill="#55C4DE" fill-opacity="0.18" stroke="#335DC6" stroke-width="1.5" />
    <text x="107" y="83" font-size="13" font-weight="600" text-anchor="middle">Bucket</text>
    <text x="107" y="101" font-size="11" fill="#4E86D7" text-anchor="middle">an upload arrives</text>

    <line x1="190" y1="87" x2="248" y2="87" stroke="#335DC6" stroke-width="1.5" marker-end="url(#wdl-arrow)" />

    <rect x="256" y="58" width="176" height="58" rx="10" fill="#55C4DE" fill-opacity="0.18" stroke="#335DC6" stroke-width="1.5" />
    <text x="344" y="83" font-size="13" font-weight="600" text-anchor="middle">Storage backend</text>
    <text x="344" y="101" font-size="11" fill="#4E86D7" text-anchor="middle">on this node</text>

    <line x1="440" y1="87" x2="498" y2="87" stroke="#335DC6" stroke-width="1.5" marker-end="url(#wdl-arrow)" />

    <rect x="506" y="58" width="222" height="58" rx="10" fill="#24A9E6" fill-opacity="0.16" stroke="#24A9E6" stroke-width="1.5" />
    <text x="617" y="83" font-size="13" font-weight="600" text-anchor="middle">Copy, in Storage locations</text>
    <text x="617" y="101" font-size="11" fill="#4E86D7" text-anchor="middle">state present, pending or unknown</text>

    <line x1="344" y1="152" x2="344" y2="124" stroke="#4E86D7" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#wdl-arrow)" />
    <rect x="204" y="152" width="280" height="50" rx="10" fill="#ffffff" stroke="#4E86D7" stroke-width="1.5" stroke-dasharray="4 4" />
    <text x="344" y="172" font-size="12" font-weight="600" text-anchor="middle">Placement policy</text>
    <text x="344" y="190" font-size="11" fill="#4E86D7" text-anchor="middle">allows or refuses; it never adds a copy</text>

    <text x="32" y="248" font-size="15" font-weight="600">Two buckets: a sync writes a second one</text>

    <rect x="32" y="266" width="176" height="46" rx="10" fill="#55C4DE" fill-opacity="0.18" stroke="#335DC6" stroke-width="1.5" />
    <text x="120" y="294" font-size="13" font-weight="600" text-anchor="middle">Bucket A</text>

    <line x1="216" y1="289" x2="322" y2="289" stroke="#24A9E6" stroke-width="1.5" marker-end="url(#wdl-arrow-aqua)" />
    <text x="269" y="281" font-size="11" fill="#24A9E6" text-anchor="middle">sync</text>

    <rect x="330" y="266" width="398" height="46" rx="10" fill="#24A9E6" fill-opacity="0.16" stroke="#24A9E6" stroke-width="1.5" />
    <text x="529" y="288" font-size="13" font-weight="600" text-anchor="middle">Bucket B on another node</text>
    <text x="529" y="304" font-size="11" fill="#4E86D7" text-anchor="middle">the target owns its copy and serves it under its own name</text>
  </g>
</svg>
