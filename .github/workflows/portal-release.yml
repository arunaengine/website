name: portal-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag or release name to create or update.
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease.
        required: true
        default: true
        type: boolean
      release_name:
        description: Optional display name for the GitHub release.
        required: false
        type: string
      api_base_url:
        description: Optional API base URL embedded into the release build, for example https://node.example.org/api/v1. Leave empty for same-origin /api/v1.
        required: false
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - name: Build release assets
        run: bun run release:assets
        env:
          PORTAL_API_BASE_URL: ${{ inputs.api_base_url }}
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name || inputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            aruna-portal-dist.tar.gz
            aruna-portal-dist.tar.gz.sha256
            portal-manifest.json
