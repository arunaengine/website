name: portal-release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to build and release.
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease.
        required: true
        default: true
        type: boolean
      release_name:
        description: Optional display name for the GitHub release.
        required: false
        type: string
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        id: source
        with:
          fetch-depth: 0
          ref: refs/tags/${{ inputs.tag }}
      - name: Verify release tooling
        run: grep -q '^PACKAGER_VERSION=2$' scripts/build-dist-tarball.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build release assets
        run: npm run release:assets
        env:
          PORTAL_VERSION: ${{ inputs.tag }}
          PORTAL_GIT_REF: ${{ inputs.tag }}
          PORTAL_GIT_COMMIT: ${{ steps.source.outputs.commit }}
      - name: Create or update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.release_name || inputs.tag }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: |
            aruna-portal-dist.tar.gz
            aruna-portal-dist.tar.gz.sha256
            portal-manifest.json
